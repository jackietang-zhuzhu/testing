<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#123540">
    <title>Set a new password | RT LorryLink</title>

    <link rel="icon" type="image/png" href="RT.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

    <header class="app-header">
        <div class="brand">
            <span class="brand-mark"><i class="ri-truck-line"></i></span>
            <span class="brand-name">RT LorryLink</span>
        </div>
    </header>

    <main class="app-main">
        <div class="view view-center flex">
            <div class="auth-wrap">
                <div class="auth-head">
                    <h2 class="auth-title">Set a new password</h2>
                    <p class="auth-sub">Choose a password you haven't used here before.</p>
                </div>

                <div class="panel">
                    <form id="update-password-form" class="form-stack">
                        <div class="field">
                            <label class="label" for="new-password">New password</label>
                            <input type="password" id="new-password" class="input" autocomplete="new-password" required minlength="6">
                            <span class="hint">At least 6 characters.</span>
                        </div>
                        <p id="form-status" class="notice notice-warn hidden" role="alert"></p>
                        <button type="submit" class="btn btn-go btn-block">Save new password</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 1. SUPABASE CONFIGURATION (Must match your app.js)
        const SUPABASE_URL = 'https://cqbuguapyeyshujhkvky.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxYnVndWFweWV5c2h1amhrdmt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTI5NTQsImV4cCI6MjEwMDI2ODk1NH0.C2EuPMe1ijXCcgJ300iGs-yjyVOs4lC-TuwGu33WAsc';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const statusEl = document.getElementById('form-status');
        function showStatus(message, tone) {
            statusEl.textContent = message; // textContent, never innerHTML
            statusEl.classList.remove('hidden');
            statusEl.style.background = tone === 'success' ? 'var(--go-soft)' : '';
            statusEl.style.color = tone === 'success' ? 'var(--go-ink)' : '';
            statusEl.style.borderColor = tone === 'success' ? '#b7dfc9' : '';
        }

        // 2. FORM SUBMISSION LOGIC
        document.getElementById('update-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Disable button to prevent double-clicks
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';
            statusEl.classList.add('hidden');

            // Because the user clicked the email link, Supabase already knows who they are.
            const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

            if (error) {
                showStatus("Couldn't update your password: " + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save new password';
                return;
            }

            showStatus('Password updated. Taking you to log in...', 'success');

            // Sign them out of this temporary session so they can log in normally
            await supabaseClient.auth.signOut();

            // Give the message a moment to be read, then go back to the main app
            setTimeout(() => { window.location.href = 'index.html'; }, 1600);
        });
    </script>
</body>
</html>
